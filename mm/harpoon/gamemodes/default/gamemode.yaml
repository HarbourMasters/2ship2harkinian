# Default gamemode pack — restrictive baseline.
#
# Used as fallback when a room's gamemode_id doesn't match any installed pack.
# Allows lobby operations, chat, and self-only player updates.

gamemode_id: default
name: "Default Lobby"
version: "1.0.0"
description: "Restrictive baseline. No combat, no save sync."
author: "Harpoon"
license: "MIT"

min_players: 1
max_players: 16
recommended_players: 2

phases: [lobby]

permissions:
  player:
    - primitive: PLAYER.UPDATE_TRANSFORM
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_SKELETON
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_LIMB_ROTATIONS
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_ANIMATION_FLAGS
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_MOTION_VARS
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_BOW_STATE
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_HAND_TYPES
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_VISUAL_STATE
      scope: self
      rate_limit: 5/sec
    - primitive: PLAYER.UPDATE_EQUIP_VISIBLE
      scope: self
      rate_limit: 10/sec
    - primitive: PLAYER.UPDATE_FACE
      scope: self
      rate_limit: 10/sec
    - primitive: PLAYER.UPDATE_SCALE
      scope: self
      rate_limit: 5/sec
    - primitive: PLAYER.UPDATE_CUSTOM_ITEM_STATE
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.SET_TRANSFORMATION
      scope: self
      rate_limit: 5/sec
    - primitive: PLAYER.UPDATE_GORON_STATE
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.SET_INVINCIBILITY_TIMER
      scope: self
      rate_limit: 10/sec
    - primitive: APPEARANCE.SKIN_SYNC.ANNOUNCE_CATALOG
      scope: room
      rate_limit: 1/10sec
    - primitive: APPEARANCE.SKIN_SYNC.UPDATE_SLOTS
      scope: room
      rate_limit: 5/sec
    - primitive: AUDIO.PLAY_SFX
      scope: self
      rate_limit: 30/sec
    - primitive: ROOM.BROADCAST_EVENT
      scope: room
      rate_limit: 5/sec
    - primitive: CHAT.MESSAGE
      scope: room
      rate_limit: 5/sec
    - primitive: CHAT.PING
      scope: room
      rate_limit: 5/sec
    - primitive: VOTING.CAST_VOTE
      scope: room
      rate_limit: 5/sec

  admin:
    - inherits: player
    - primitive: ROOM.SET_GAMEMODE_CONFIG
      scope: room
      rate_limit: 1/sec
    - primitive: ROOM.SET_PHASE
      scope: room
      rate_limit: 2/sec
    - primitive: ADMIN.PROMOTE
      scope: any_in_room
      rate_limit: 1/sec
    - primitive: ADMIN.DEMOTE
      scope: any_in_room
      rate_limit: 1/sec

  host:
    - inherits: admin
    - primitive: ROOM.SET_GAMEMODE_ID
      scope: room
      rate_limit: 1/sec
    - primitive: ADMIN.SET_HOST
      scope: any_in_room
      rate_limit: 1/sec
    - primitive: ADMIN.KICK
      scope: any_in_room
      rate_limit: 1/sec
