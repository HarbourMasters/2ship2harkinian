# mm-geoguessr — free-for-all PvP for Majora's Mask.
#
# All players share the same scenes and can hit each other. Nametags and
# minimap markers are hidden client-side (gNetwork.Harpoon.GeoguessrMode) so
# you have to find the others by sight — share screenshots over Discord and
# guess where everyone is. PvP damage and scene/flag sync are permitted here.

gamemode_id: geoguessr
name: "MM Geoguessr (PvP)"
version: "1.0.0"
description: "Free-for-all PvP. Find each other by sight. Flags sync."
author: "Skijer"
license: "MIT"

min_players: 1
max_players: 16
recommended_players: 2

phases: [lobby, playing]

default_config:
  pvp_enabled: true
  sync_flags: true
  sync_items: false

permissions:
  player:
    - primitive: PLAYER.UPDATE_TRANSFORM
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_SKELETON
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_LIMB_ROTATIONS
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_ANIMATION_FLAGS
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_MOTION_VARS
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.UPDATE_VISUAL_STATE
      scope: self
      rate_limit: 5/sec
    - primitive: PLAYER.UPDATE_EQUIP_VISIBLE
      scope: self
      rate_limit: 10/sec
    - primitive: PLAYER.UPDATE_FACE
      scope: self
      rate_limit: 10/sec
    - primitive: PLAYER.UPDATE_SCALE
      scope: self
      rate_limit: 5/sec
    - primitive: PLAYER.UPDATE_CUSTOM_ITEM_STATE
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.SET_TRANSFORMATION
      scope: self
      rate_limit: 5/sec
    - primitive: PLAYER.UPDATE_GORON_STATE
      scope: self
      rate_limit: 30/sec
    - primitive: PLAYER.KILL
      scope: self
      rate_limit: 5/sec
    # Combat — PvP.
    - primitive: COMBAT.DEAL_DAMAGE
      scope: room
      rate_limit: 30/sec
    - primitive: COMBAT.APPLY_STATUS
      scope: room
      rate_limit: 30/sec
    - primitive: COMBAT.CUSTOM_EFFECT
      scope: room
      rate_limit: 30/sec
    # VFX mirror (projectiles, spells).
    - primitive: APPEARANCE.SPAWN_VFX_ACTOR
      scope: room
      rate_limit: 30/sec
    - primitive: APPEARANCE.SKIN_SYNC.ANNOUNCE_CATALOG
      scope: room
      rate_limit: 1/10sec
    - primitive: APPEARANCE.SKIN_SYNC.UPDATE_SLOTS
      scope: room
      rate_limit: 5/sec
    # Flag sync.
    - primitive: SAVE.SET_FLAG
      scope: room
      rate_limit: 30/sec
    - primitive: SAVE.UNSET_FLAG
      scope: room
      rate_limit: 30/sec
    - primitive: AUDIO.PLAY_SFX
      scope: self
      rate_limit: 30/sec
    - primitive: ROOM.BROADCAST_EVENT
      scope: room
      rate_limit: 30/sec
    - primitive: CHAT.MESSAGE
      scope: room
      rate_limit: 5/sec
    - primitive: CHAT.PING
      scope: room
      rate_limit: 5/sec

  admin:
    - inherits: player
    - primitive: ROOM.SET_GAMEMODE_CONFIG
      scope: room
      rate_limit: 1/sec
    - primitive: ROOM.SET_PHASE
      scope: room
      rate_limit: 2/sec
    - primitive: ADMIN.PROMOTE
      scope: any_in_room
      rate_limit: 1/sec
    - primitive: ADMIN.DEMOTE
      scope: any_in_room
      rate_limit: 1/sec

  host:
    - inherits: admin
    - primitive: ROOM.SET_GAMEMODE_ID
      scope: room
      rate_limit: 1/sec
    - primitive: ADMIN.SET_HOST
      scope: any_in_room
      rate_limit: 1/sec
    - primitive: ADMIN.KICK
      scope: any_in_room
      rate_limit: 1/sec
